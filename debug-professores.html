<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Professores</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/notifications-global.css">
    <style>
        .debug-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 2000;
            max-width: 300px;
            font-size: 12px;
        }
        .debug-panel h4 {
            margin: 0 0 10px 0;
            color: #3b82f6;
        }
        .debug-panel button {
            margin: 5px 0;
            padding: 5px 10px;
            border: 1px solid #3b82f6;
            background: white;
            color: #3b82f6;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .debug-panel button:hover {
            background: #3b82f6;
            color: white;
        }
        .status {
            margin: 5px 0;
            padding: 5px;
            border-radius: 4px;
        }
        .status.success { background: #d1fae5; color: #065f46; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .status.warning { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 14l9-5-9-5-9 5 9 5z"/>
                    <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                </svg>
                <h1 class="logo-text">EducaGestaoDF</h1>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-content">
                    <h2 class="page-title">Debug - Gestão de Professores</h2>
                    <div class="header-actions">
                        <button class="icon-button notifications-btn" title="Notificações" id="notificationButton">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                            </svg>
                            <span class="notification-badge" id="notificationBadge">3</span>
                        </button>
                        <button class="icon-button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <div style="padding: 2rem;">
                <h3>Debug da Página de Professores</h3>
                <p>Esta página é para debugar o sistema de notificações especificamente na página de professores.</p>
            </div>
        </main>
    </div>

    <!-- Debug Panel -->
    <div class="debug-panel">
        <h4>🔧 Debug Panel</h4>
        <div id="statusContainer"></div>
        <button onclick="testNotificationClick()">Testar Clique Manual</button>
        <button onclick="checkGlobalNotifications()">Verificar GlobalNotifications</button>
        <button onclick="reinitializeSystem()">Reinicializar Sistema</button>
        <button onclick="addTestNotification()">Adicionar Notificação</button>
        <button onclick="window.debugNotifications()">Debug Completo</button>
    </div>

    <script src="js/notifications-global.js"></script>
    <script>
        let debugLog = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            debugLog.push(`[${timestamp}] ${message}`);
            console.log(`[DEBUG] ${message}`);
            updateStatus();
        }

        function updateStatus() {
            const container = document.getElementById('statusContainer');
            const recentLogs = debugLog.slice(-5);
            container.innerHTML = recentLogs.map(log => 
                `<div class="status ${getLogType(log)}">${log}</div>`
            ).join('');
        }

        function getLogType(log) {
            if (log.includes('ERROR') || log.includes('Erro')) return 'error';
            if (log.includes('WARNING') || log.includes('Aviso')) return 'warning';
            return 'success';
        }

        function testNotificationClick() {
            log('Testando clique manual no botão...');
            const btn = document.getElementById('notificationButton');
            if (btn) {
                btn.click();
                log('Clique executado');
            } else {
                log('ERROR: Botão não encontrado');
            }
        }

        function checkGlobalNotifications() {
            if (window.globalNotifications) {
                log(`GlobalNotifications OK - ${globalNotifications.notifications.length} notificações`);
            } else {
                log('ERROR: GlobalNotifications não encontrado');
            }
        }

        function reinitializeSystem() {
            log('Reinicializando sistema...');
            if (window.initializeNotifications) {
                window.initializeNotifications();
                log('Sistema reinicializado');
            } else {
                log('ERROR: Função de inicialização não encontrada');
            }
        }

        function addTestNotification() {
            if (window.globalNotifications) {
                globalNotifications.addNotification({
                    type: 'system',
                    title: 'Teste Debug',
                    message: 'Notificação de teste adicionada via debug',
                    icon: 'user-plus'
                });
                log('Notificação de teste adicionada');
            } else {
                log('ERROR: Não foi possível adicionar notificação');
            }
        }

        // Monitor page load
        document.addEventListener('DOMContentLoaded', function() {
            log('DOM carregado');
            
            setTimeout(() => {
                log('Verificando sistema após 1s...');
                checkGlobalNotifications();
                
                const btn = document.querySelector('.notifications-btn');
                if (btn) {
                    log('Botão de notificação encontrado');
                    
                    // Add manual click handler for testing
                    btn.addEventListener('click', function(e) {
                        log('Clique detectado no botão!');
                        e.preventDefault();
                        e.stopPropagation();
                        
                        if (window.globalNotifications) {
                            log('Chamando toggleDropdown...');
                            globalNotifications.toggleDropdown();
                        } else {
                            log('ERROR: globalNotifications não disponível no clique');
                        }
                    });
                } else {
                    log('ERROR: Botão de notificação não encontrado');
                }
            }, 1000);
        });

        // Monitor global notifications loading
        let checkInterval = setInterval(() => {
            if (window.globalNotifications) {
                log('GlobalNotifications carregado com sucesso!');
                clearInterval(checkInterval);
            }
        }, 100);

        // Timeout check
        setTimeout(() => {
            if (!window.globalNotifications) {
                log('ERROR: GlobalNotifications não carregou em 5s');
            }
            clearInterval(checkInterval);
        }, 5000);
    </script>
</body>
</html>
